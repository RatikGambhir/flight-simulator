
name: Build macOS app

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-macos.yml'
  workflow_dispatch:

concurrency:
  group: build-macos-release
  queue: max

permissions:
  contents: write

defaults:
  run:
    working-directory: app

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Get app version
        id: version
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app -> target

      - name: Install dependencies
        run: npm ci

      - name: Check graphics regressions
        run: |
          npm run test:graphics
          npm run test:graphics:gpu

      - name: Run simulation tests
        run: cargo test -p sim-core

      # Convert the GitHub secret into a .p8 file
      # that Tauri can use for Apple notarization.
      - name: Prepare Apple notarization key
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Build universal app
        run: npm run tauri build -- --target universal-apple-darwin --no-bundle

      # Tauri signs and notarizes the app during packaging.
      - name: Package signed and notarized universal app
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          export LC_ALL=C
          log=$(mktemp)
          trap 'rm -f "$log"' EXIT

          for attempt in 1 2 3; do
            if npm run tauri bundle -- --target universal-apple-darwin --bundles app,dmg 2>&1 | tee "$log"; then
              exit 0
            else
              status=$?
            fi

            if [[ "$attempt" == 3 ]] || ! grep -Eiq 'A timestamp was expected but was not found|timestamp service is not available' "$log"; then
              exit "$status"
            fi

            delay=$((30 * attempt))
            echo "::warning::Apple signing timestamp unavailable. Retrying packaging in ${delay}s (attempt $((attempt + 1))/3)."
            sleep "$delay"
          done

      - name: Verify Apple signature and notarization
        run: |
          APP="target/universal-apple-darwin/release/bundle/macos/GeoFlight.app"
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          DMG="target/universal-apple-darwin/release/bundle/dmg/GeoFlight_${VERSION}_universal.dmg"

          codesign --verify --verbose=2 "$DMG"
          codesign --verify --deep --strict --verbose=2 "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=4 "$APP"

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: GeoFlight-macOS
          path: app/target/universal-apple-darwin/release/bundle/dmg/*.dmg

      - name: Check whether the version tag exists
        id: release-tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --refs origin "refs/tags/$RELEASE_TAG"; then
            echo "Tag $RELEASE_TAG already exists. Skipping release."
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              exit "$status"
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        if: steps.release-tag.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: GeoFlight ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            Universal macOS build (Apple Silicon + Intel).

            Signed and notarized by Apple.

            Download the DMG and drag GeoFlight to Applications.
          files: app/target/universal-apple-darwin/release/bundle/dmg/*.dmg
