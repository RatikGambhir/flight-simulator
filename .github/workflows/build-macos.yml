
name: Build macOS app

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-macos.yml'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: app

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app -> target

      - name: Install dependencies
        run: npm ci

      - name: Check graphics regressions
        run: |
          npm run test:graphics
          npm run test:graphics:gpu

      - name: Run simulation tests
        run: cargo test -p sim-core

      # Convert the GitHub secret into a .p8 file
      # that Tauri can use for Apple notarization.
      - name: Prepare Apple notarization key
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      # Tauri signs and notarizes the app automatically.
      - name: Build signed and notarized universal app
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          npm run tauri build -- \
            --target universal-apple-darwin \
            --bundles app,dmg

      - name: Verify Apple signature and notarization
        run: |
          APP="target/universal-apple-darwin/release/bundle/macos/GeoFlight.app"

          codesign --verify --deep --strict --verbose=2 "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=4 "$APP"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeoFlight-macOS
          path: app/target/universal-apple-darwin/release/bundle/dmg/*.dmg

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: GeoFlight build ${{ github.run_number }}
          body: |
            Universal macOS build (Apple Silicon + Intel).

            Signed and notarized by Apple.

            Download the DMG and drag GeoFlight to Applications.
          files: app/target/universal-apple-darwin/release/bundle/dmg/*.dmg
